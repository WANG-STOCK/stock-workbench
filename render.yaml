# Render Blueprint —— 一键部署「技术面股票工作台」
services:
  - type: web
    name: wang-zhibiao-2026
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python server.py"
    healthCheckPath: /api/config
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
